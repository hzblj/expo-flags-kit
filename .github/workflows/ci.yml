name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, flags, pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      # rsvg-convert, which renders the flags for `flags:verify`.
      - name: Install librsvg
        run: sudo apt-get update && sudo apt-get install --yes librsvg2-bin

      - name: Install dependencies
        run: yarn install --immutable

      - name: Biome
        run: yarn biome:check

      - name: Typecheck
        run: yarn typecheck

      # Codes, emoji and the SVG normalization, and every generated file against what the FlagKit sources produce.
      - name: Test
        run: yarn test

      # Renders every generated flag next to its FlagKit source and compares them pixel by pixel.
      - name: Verify flags
        run: yarn flags:verify

      # Builds the package, packs it the way npm will receive it and type-checks real usage from a throwaway consumer.
      - name: Pack check
        run: yarn pack:check

  android:
    name: Android module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # The module compiles inside the example's Gradle project, the way an app builds it, drawables included.
      - name: Prebuild the example
        run: yarn workspace expo-flags-kit-example expo prebuild --platform android --no-install

      - name: Compile the module
        working-directory: apps/example/android
        run: ./gradlew :hzblj-expo-flags-kit:compileDebugKotlin --console=plain
